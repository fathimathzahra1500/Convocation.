<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Convocation Poster</title>

  <!-- Premium Certificate Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      text-align: center;
      background: #fff;
    }

    .container {
      position: relative;
      display: inline-block;
    }

    .poster {
      width: 100%;
      max-width: 800px;
      display: block;
    }

    .name {
      position: absolute;
      top: 78%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 26px;
      color: #0b3d91;
      width: 80%;
      font-family: 'Great Vibes', cursive; /* ✨ signature style */
      letter-spacing: 1px;
    }

    input {
      margin-top: 20px;
      padding: 10px;
      font-size: 16px;
      width: 250px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      background: #0b3d91;
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #092c6c;
    }
  </style>
</head>

<body>

  <div id="capture" class="container">
    <img src="poster.jpg" class="poster">
    <div class="name" id="nameText">Your Name</div>
  </div>

  <br>

  <input type="text" placeholder="Enter your name" oninput="updateName(this.value)">

  <br>

  <button onclick="downloadImage()">Download Image</button>

  <!-- html2canvas -->
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <script>
    function updateName(value) {
      document.getElementById("nameText").innerText = value || "Your Name";
    }

    function downloadImage() {
      html2canvas(document.getElementById("capture")).then(canvas => {
        let link = document.createElement('a');
        link.download = 'poster.png';
        link.href = canvas.toDataURL();
        link.click();
      });
    }
  </script>

</body>
</html>
