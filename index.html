<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Convocation Poster</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      text-align: center;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    .container {
      position: relative;
      display: inline-block;
    }

    .poster {
      width: 100%;
      max-width: 800px;
      display: block;
    }

    .name {
      position: absolute;
      top: 79%;   /* 👈 mukalil adjust cheythu */
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;  /* 👈 size kurachu */
      font-weight: bold;
      color: #000;
      width: 80%;
    }

    input {
      margin-top: 20px;
      padding: 10px;
      font-size: 16px;
      width: 250px;
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="poster.jpg" class="poster">
    <div class="name" id="nameText">Your Name</div>
  </div>

  <br>

  <input type="text" placeholder="Enter your name" oninput="updateName(this.value)">

  <script>
    function updateName(value) {
      document.getElementById("nameText").innerText = value || "Your Name";
    }
  </script>

</body>
</html>
