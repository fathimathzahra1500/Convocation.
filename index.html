<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name Editing Card</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card container */
.card {
    position: relative;
    width: 320px;
    max-width: 90vw;
}

/* Poster image */
.card img {
    width: 100%;
    display: block;
}

/* Name position */
.name-box {
    position: absolute;
    top: 80%; /* ✅ FINAL POSITION */
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70%;
    text-align: center;
}

/* Name input */
.name-box input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    text-align: center;

    font-size: clamp(12px, 3vw, 18px); /* ✅ AUTO SIZE */
    font-weight: 600;

    color: #0a2a66; /* ✅ DARK BLUE */
    font-family: 'Segoe UI', Arial, sans-serif;
    letter-spacing: 0.5px;
}

/* Download button */
.download-btn {
    margin-top: 15px;
    text-align: center;
}

button {
    padding: 10px 18px;
    border: none;
    background: #0a2a66;
    color: white;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
}

/* Button hover */
button:hover {
    opacity: 0.9;
}
</style>
</head>

<body>

<div>
    <div class="card" id="capture">

        <!-- ✅ IMPORTANT: poster.png same folder il vechaaal mathi -->
        <img src="poster.png" alt="Poster">

        <div class="name-box">
            <input type="text" id="nameInput" placeholder="Enter Name">
        </div>

    </div>

    <div class="download-btn">
        <button onclick="downloadImage()">Download</button>
    </div>
</div>

<!-- html2canvas -->
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<script>
function downloadImage() {
    html2canvas(document.getElementById("capture"), {
        scale: 2
    }).then(canvas => {
        let link = document.createElement("a");
        link.download = "poster.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
    });
}
</script>

</body>
</html>
