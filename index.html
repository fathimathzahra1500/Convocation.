<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Convocation Poster</title>

  <!-- Stylish Certificate Font -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- html2canvas -->
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      text-align: center;
      background: #fff;
    }

    .container {
      position: relative;
      display: inline-block;
    }

    .poster {
      width: 100%;
      max-width: 800px;
      display: block;
    }

    .name {
      position: absolute;
      top: 78%;   /* ✅ Position */
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 22px;  /* ✅ Size */
      color: #0b3d91;   /* ✅ Dark blue */
      width: 80%;
      font-family: 'Great Vibes', cursive; /* ✅ Stylish */
    }

    input {
      margin-top: 20px;
      padding: 10px;
      font-size: 16px;
      width: 250px;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      background: #0b3d91;
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #092c6c;
    }
  </style>
</head>

<body>

  <div id="capture" class="container">
    <img src="poster.jpg" class="poster">
    <div class="name" id="nameText">Your Name</div>
  </div>

  <br>

  <input type="text" placeholder="Enter your name" oninput="updateName(this.value)">

  <br>

  <button onclick="downloadImage()">Download Image</button>

  <script>
    function updateName(value) {
      document.getElementById("nameText").innerText = value || "Your Name";
    }

    function downloadImage() {
      html2canvas(document.getElementById("capture")).then(function(canvas) {
        const link = document.createElement("a");
        link.download = "poster.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }
  </script>

</body>
</html>
